name: CI

# This repo's own pipeline does double duty:
#   1. unit-tests the toolkit (pytest) across the supported Python range
#   2. dogfoods the composite actions against examples/. The demo IS the
#      integration test, in both directions: the clean fixtures must pass
#      and the deliberately dirty ones must be blocked.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: "🧪 Unit Tests (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor: Python 3.9 reached end of life in October 2025
        # and pandas 3.x requires >=3.11. A compliance gate should not invite
        # adopters to run on an unpatched runtime.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Install conftest (exercises the Rego pack in unit tests)
        env:
          CONFTEST_VERSION: "0.56.0"
          CONFTEST_SHA256: "620f41640d63bbde1646a108ce2816ba54c980466ceebb7e754dda2d508e8cd5"
        run: |
          set -euo pipefail
          TARBALL="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -sSLf --retry 3 -o "$TARBALL" \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/${TARBALL}"
          echo "${CONFTEST_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xzf "$TARBALL" conftest
          sudo mv conftest /usr/local/bin/
      - run: pytest tests/ -v

  compliance-gates:
    name: "🔍 Compliance Gates (dogfooding)"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # ---- positive path: clean fixtures must pass ----
      - name: PII Scan (POL-PRIV-001)
        uses: ./.github/actions/pii-scan
        with:
          path: ./examples/sample_data/customers_anonymized.csv

      - name: Model Card Validation (POL-GOV-002)
        uses: ./.github/actions/model-card-check
        with:
          path: ./examples/model_cards/compliant

      - name: Infrastructure Policy Enforcement (POL-PRIV/SEC)
        uses: ./.github/actions/policy-check
        with:
          terraform-paths: "infrastructure/modules/ml-platform/*.tf"

      # ---- negative path: every gate must actually block ----
      - name: PII gate blocks dirty data
        run: |
          set -euo pipefail
          if python scripts/pii_scanner.py --path ./examples/sample_data/customers.csv --output-format github; then
            echo "::error::Dirty dataset should have been blocked"; exit 1
          fi
          echo "✅ Gate correctly blocked PII-laden dataset"

      - name: Model card gate blocks non-compliant card
        run: |
          set -euo pipefail
          if python scripts/model_card_validator.py --path ./examples/model_cards/non_compliant --output-format github; then
            echo "::error::Non-compliant card should have failed"; exit 1
          fi
          echo "✅ Gate correctly blocked incomplete model card"

      - name: Policy gate blocks non-compliant Terraform
        run: |
          set -euo pipefail
          if conftest test --parser hcl2 --combine -p policy examples/terraform/non_compliant/*.tf; then
            echo "::error::Non-compliant Terraform should have been blocked"; exit 1
          fi
          echo "✅ Gate correctly blocked non-compliant infrastructure"

      - name: Gates refuse to pass when they scan nothing
        run: |
          set -euo pipefail
          mkdir -p /tmp/empty-scan
          rc=0; python scripts/pii_scanner.py --path /tmp/empty-scan || rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "::error::Empty scan must exit 2 (misconfigured), got $rc"; exit 1
          fi
          rc=0; python scripts/model_card_validator.py --path /tmp/empty-scan || rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "::error::Empty model-card check must exit 2 (misconfigured), got $rc"; exit 1
          fi
          echo "✅ Gates fail closed on an empty scan target"

      - name: PII gate refuses to pass on partial coverage
        run: |
          set -euo pipefail
          mkdir -p /tmp/partial-scan
          printf 'id,note\n1,hello\n' > /tmp/partial-scan/clean.csv
          printf 'not a spreadsheet' > /tmp/partial-scan/legacy.xlsx
          rc=0; python scripts/pii_scanner.py --path /tmp/partial-scan || rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "::error::Unreadable data must exit 2 (coverage gap), got $rc"; exit 1
          fi
          # Opting in continues, but the gap has to stay on the record.
          python scripts/pii_scanner.py --path /tmp/partial-scan --allow-unscanned \
            --output-format json --output-file /tmp/partial-scan-report.json > /dev/null
          python - <<'PY'
          import json, sys
          r = json.load(open("/tmp/partial-scan-report.json"))
          if r["summary"]["files_unscanned"] != 1 or not r["unscanned"]:
              sys.exit(f"::error::coverage gap missing from the report: {r['summary']}")
          PY
          echo "✅ Gate fails closed on data it cannot read"

      - name: Dirty data hidden in a non-CSV format is still caught
        run: |
          set -euo pipefail
          mkdir -p /tmp/jsonl-scan
          printf 'id,note\n1,hello\n' > /tmp/jsonl-scan/clean.csv
          echo '{"eid": "784-1985-1234567-1"}' > /tmp/jsonl-scan/train.jsonl
          if python scripts/pii_scanner.py --path /tmp/jsonl-scan --output-format github; then
            echo "::error::Emirates ID in a JSONL shard should have been blocked"; exit 1
          fi
          echo "✅ Gate scans past the first CSV it finds"

      - name: Evidence Pack (POL-GOV-003)
        if: always()
        uses: ./.github/actions/evidence-pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-pack
          path: evidence/
          retention-days: 90

  marketplace-action:
    name: "🏷️ Root Action (Marketplace listing)"
    runs-on: ubuntu-latest
    needs: unit-tests
    # The root action.yml is the only thing GitHub lists in the Marketplace,
    # and it re-invokes the engines rather than delegating to the four
    # sub-folder actions. Unit tests hold the two in parity on paper; this
    # job is the one that actually runs the listed action end to end.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ---- positive path: the whole toolkit behind one `uses:` ----
      - name: All gates, clean fixtures
        id: gates
        uses: ./
        with:
          data-path: ./examples/sample_data/customers_anonymized.csv
          model-cards-path: ./examples/model_cards/compliant
          terraform-paths: "infrastructure/modules/ml-platform/*.tf"
          evidence-dir: evidence-root
          evidence-artifact-name: evidence-pack-root-action

      - name: Outputs are populated
        env:
          RESULT: ${{ steps.gates.outputs.overall-result }}
          DIGEST: ${{ steps.gates.outputs.content-digest }}
        run: |
          set -euo pipefail
          if [ "$RESULT" != "PASS" ]; then
            echo "::error::clean fixtures should produce PASS, got '${RESULT}'"; exit 1
          fi
          if ! printf '%s' "$DIGEST" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::content-digest is not a sha256: '${DIGEST}'"; exit 1
          fi
          echo "✅ Root action reported ${RESULT} with a verifiable digest"

      # ---- negative path: asked to check nothing, it must not go green ----
      - name: No gate requested
        id: nogate
        continue-on-error: true
        uses: ./
        with:
          upload-evidence: "false"

      - name: A run that checks nothing is a failure
        run: |
          set -euo pipefail
          if [ "${{ steps.nogate.outcome }}" != "failure" ]; then
            echo "::error::the action passed without being given a single gate to run"; exit 1
          fi
          echo "✅ Root action fails closed when no gate is requested"

      # ---- negative path: a real violation must still block ----
      - name: Dirty data blocks the listed action
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          data-path: ./examples/sample_data/customers.csv
          evidence-dir: evidence-dirty
          upload-evidence: "false"

      - name: Violation blocked
        run: |
          set -euo pipefail
          if [ "${{ steps.dirty.outcome }}" != "failure" ]; then
            echo "::error::PII-laden fixture passed the listed action"; exit 1
          fi
          echo "✅ Root action blocked the PII-laden dataset"

  terraform-validate:
    name: "🏗️ Terraform Static Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.x"
      - name: Format check
        working-directory: ./infrastructure
        run: terraform fmt -check -recursive
      - name: Init (no backend, no credentials)
        working-directory: ./infrastructure
        run: terraform init -backend=false
      - name: Validate
        working-directory: ./infrastructure
        run: terraform validate

  security-scan:
    name: "🛡️ Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan
        # NOTE: the tag is v-prefixed; 'aquasecurity/trivy-action@0.28.0'
        # does not resolve and fails the job at setup.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # trivy-action defaults to a trivy version that has no
          # GitHub release (v0.65.0 in v0.33.1, a 404), so its installer exits
          # 1 and the scan is skipped entirely. Pin one that ships assets.
          version: v0.74.0
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          # The non-compliant fixture is insecure on purpose: it is the
          # negative test the policy gate must block. Scanning it would
          # fail this job by design. Everything else, including the
          # reference module, is still scanned.
          skip-dirs: examples/terraform/non_compliant
