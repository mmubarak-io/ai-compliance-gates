name: Compliance Gates (Reusable)

# Adopt the full pipeline from your own repo:
#
#   jobs:
#     compliance:
#       uses: mmubarak-io/ai-compliance-gates/.github/workflows/gates.yml@v1
#       with:
#         data-path: ./data
#         model-cards-path: ./model_cards
#         terraform-paths: "infra/*.tf"
#
# Every gate is opt-in: leave an input empty and that gate is skipped.
# A gate that runs but finds nothing to check fails as misconfigured
# rather than reporting success, and so does one that can only cover part
# of what it was pointed at. Set allow-empty / allow-unscanned if either
# is genuinely expected.

on:
  workflow_call:
    inputs:
      data-path:
        description: "Data file or directory to scan for PII (CSV, TSV, JSON, JSON Lines, Parquet)"
        type: string
        required: false
        default: ""
      model-cards-path:
        description: "Model card file or directory to validate"
        type: string
        required: false
        default: ""
      terraform-paths:
        description: "Space-separated Terraform files/globs to enforce policies against"
        type: string
        required: false
        default: ""
      config:
        description: "Path to your compliance.config.yml"
        type: string
        required: false
        default: ""
      allow-empty:
        description: "Treat 'nothing found to check' as a pass instead of a misconfiguration"
        type: boolean
        required: false
        default: false
      allow-unscanned:
        description: "Continue when the data path holds files the PII scanner cannot read. The gap is recorded and the evidence pack reports that gate as PARTIAL."
        type: boolean
        required: false
        default: false
      python-version:
        description: "Python version used to run the gates"
        type: string
        required: false
        default: "3.11"
      evidence-retention-days:
        description: "How long to retain the evidence pack artifact"
        type: number
        required: false
        default: 90

permissions:
  contents: read

jobs:
  gates:
    name: "🔍 Compliance Gates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A run that was asked to check nothing must not report success.
      # Without this, calling this workflow with no path inputs skips every
      # gate, writes an evidence pack that says FAIL, and still exits green:
      # a compliance badge for checks that never ran.
      - name: Require at least one gate
        env:
          DATA_PATH: ${{ inputs.data-path }}
          MODEL_CARDS_PATH: ${{ inputs.model-cards-path }}
          TERRAFORM_PATHS: ${{ inputs.terraform-paths }}
        run: |
          set -euo pipefail
          if [ -z "$DATA_PATH" ] && [ -z "$MODEL_CARDS_PATH" ] && [ -z "$TERRAFORM_PATHS" ]; then
            echo "::error title=Compliance Gates Misconfigured::No gate was given anything to check. Set at least one of data-path, model-cards-path or terraform-paths."
            exit 2
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: PII Scan (POL-PRIV-001)
        if: inputs.data-path != ''
        uses: mmubarak-io/ai-compliance-gates/.github/actions/pii-scan@v1
        with:
          path: ${{ inputs.data-path }}
          config: ${{ inputs.config }}
          allow-empty: ${{ inputs.allow-empty }}
          allow-unscanned: ${{ inputs.allow-unscanned }}

      - name: Model Card Validation (POL-GOV-002)
        if: ${{ !cancelled() && inputs.model-cards-path != '' }}
        uses: mmubarak-io/ai-compliance-gates/.github/actions/model-card-check@v1
        with:
          path: ${{ inputs.model-cards-path }}
          config: ${{ inputs.config }}
          allow-empty: ${{ inputs.allow-empty }}

      - name: Infrastructure Policy Enforcement (POL-PRIV/SEC)
        if: ${{ !cancelled() && inputs.terraform-paths != '' }}
        uses: mmubarak-io/ai-compliance-gates/.github/actions/policy-check@v1
        with:
          terraform-paths: ${{ inputs.terraform-paths }}

      # Runs even when a gate above failed: the evidence pack records what
      # was checked and what was not, which is exactly what an auditor needs
      # from a failed run.
      - name: Evidence Pack (POL-GOV-003)
        if: ${{ !cancelled() }}
        uses: mmubarak-io/ai-compliance-gates/.github/actions/evidence-pack@v1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-pack
          path: evidence/
          retention-days: ${{ inputs.evidence-retention-days }}
