version: 2
updates:
  # The actions this toolkit depends on (checkout, setup-python, trivy...).
  # A compliance gate pinned to a stale action is its own kind of drift.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"

  # Composite actions are separate manifests as far as Dependabot is concerned.
  - package-ecosystem: github-actions
    directory: "/.github/actions/pii-scan"
    schedule:
      interval: weekly
    labels: ["dependencies", "github-actions"]
  - package-ecosystem: github-actions
    directory: "/.github/actions/model-card-check"
    schedule:
      interval: weekly
    labels: ["dependencies", "github-actions"]
  - package-ecosystem: github-actions
    directory: "/.github/actions/policy-check"
    schedule:
      interval: weekly
    labels: ["dependencies", "github-actions"]
  - package-ecosystem: github-actions
    directory: "/.github/actions/evidence-pack"
    schedule:
      interval: weekly
    labels: ["dependencies", "github-actions"]

  # Floors stay permissive on purpose: an adopter should be able to resolve
  # these against what they already have installed. The suite passes on both
  # the declared floor and the latest release, so the default `increase`
  # strategy would raise the minimum every week and narrow compatibility
  # without buying anything. `increase-if-necessary` moves a floor only when
  # the current requirement genuinely cannot resolve against the new version,
  # which is the only time it should move. Security advisories arrive through
  # a separate channel and are unaffected.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps"
