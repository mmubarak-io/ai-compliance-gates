name: "AI Compliance Gates"
description: "Block PII, incomplete model cards and non-compliant Terraform in CI. UAE PDPL, GDPR and EU AI Act, enforced as gates."
author: "mmubarak-io"

branding:
  icon: shield
  color: green

# The whole toolkit behind one `uses:`. The four gates are also available
# individually under .github/actions/, and the same pipeline is available as
# a reusable workflow at .github/workflows/gates.yml; this file exists so
# `uses: mmubarak-io/ai-compliance-gates@v1` does what the repository name
# says, and so the actions are listable in GitHub Marketplace, which only
# ever lists the action.yml at a repository's root.
#
# Every gate is opt-in: leave an input empty and that gate is skipped. Asking
# for no gates at all is a misconfiguration, not a pass. See the first step.

inputs:
  data-path:
    description: "Data file or directory to scan for PII (CSV, TSV, JSON, JSON Lines, Parquet, compressed or not)"
    required: false
    default: ""
  model-cards-path:
    description: "Model card file or directory to validate"
    required: false
    default: ""
  terraform-paths:
    description: "Space-separated Terraform files/globs to enforce policies against"
    required: false
    default: ""
  config:
    description: "Path to your compliance.config.yml"
    required: false
    default: ""
  allow-empty:
    description: "Treat 'nothing found to check' as a pass instead of a misconfiguration"
    required: false
    default: "false"
  allow-unscanned:
    description: "Continue when the data path holds files the PII scanner cannot read. The gap is recorded and the evidence pack reports that gate as PARTIAL."
    required: false
    default: "false"
  policy-dir:
    description: "Directory of Rego policies (defaults to this repo's UAE policy pack)"
    required: false
    default: ""
  conftest-version:
    description: "Conftest version to install"
    required: false
    default: "0.56.0"
  conftest-sha256:
    description: >-
      SHA-256 of the conftest Linux x86_64 tarball. Defaults to the checksum for
      the pinned conftest-version; if you override the version you must supply
      the matching checksum from that release's checksums.txt.
    required: false
    default: "620f41640d63bbde1646a108ce2816ba54c980466ceebb7e754dda2d508e8cd5"
  python-version:
    description: "Python version to set up for the gates. Leave empty to use the Python already on the runner."
    required: false
    default: "3.11"
  evidence-dir:
    description: "Directory to write evidence_pack.json / .md"
    required: false
    default: "evidence"
  upload-evidence:
    description: "Upload the evidence pack as a workflow artifact"
    required: false
    default: "true"
  evidence-artifact-name:
    description: "Name of the uploaded artifact. Give each invocation its own name when the action runs more than once in a workflow run."
    required: false
    default: "evidence-pack"
  evidence-retention-days:
    description: "How long to retain the evidence pack artifact"
    required: false
    default: "90"

outputs:
  content-digest:
    description: "sha256 of the generated pack. Feed it to actions/attest-build-provenance to turn the pack's own checksum into signed, verifiable provenance."
    value: ${{ steps.digest.outputs.content-digest }}
  overall-result:
    description: "PASS, PARTIAL or FAIL"
    value: ${{ steps.digest.outputs.overall-result }}

runs:
  using: composite
  steps:
    # A run that was asked to check nothing must not report success. Without
    # this, `uses: ai-compliance-gates@v1` with no inputs skips every gate,
    # writes an evidence pack that says FAIL, and still exits green: a
    # compliance badge for checks that never ran.
    - name: Require at least one gate
      shell: bash
      env:
        DATA_PATH: ${{ inputs.data-path }}
        MODEL_CARDS_PATH: ${{ inputs.model-cards-path }}
        TERRAFORM_PATHS: ${{ inputs.terraform-paths }}
      run: |
        set -euo pipefail
        if [ -z "$DATA_PATH" ] && [ -z "$MODEL_CARDS_PATH" ] && [ -z "$TERRAFORM_PATHS" ]; then
          echo "::error title=Compliance Gates Misconfigured::No gate was given anything to check. Set at least one of data-path, model-cards-path or terraform-paths."
          exit 2
        fi

    - name: Set up Python
      if: inputs.python-version != ''
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      # requirements.txt is the version declaration, used as a full install
      # when the PII gate runs (pandas, pyarrow) and as a constraints file
      # otherwise. A bare `pip install pandas` silently drifts from what this
      # project tests.
      env:
        REQUIREMENTS: ${{ github.action_path }}/requirements.txt
        DATA_PATH: ${{ inputs.data-path }}
      run: |
        set -euo pipefail
        if [ -n "$DATA_PATH" ]; then
          pip install --quiet -r "$REQUIREMENTS"
        else
          pip install --quiet -c "$REQUIREMENTS" pyyaml
        fi

    # Inputs are passed through env rather than interpolated into the script
    # body, so a value containing shell metacharacters is data, not code.
    - name: PII Scan (POL-PRIV-001)
      if: inputs.data-path != ''
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.data-path }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_OUTPUT_FILE: reports/pii_scan.json
        INPUT_ALLOW_EMPTY: ${{ inputs.allow-empty }}
        INPUT_ALLOW_UNSCANNED: ${{ inputs.allow-unscanned }}
        SCANNER: ${{ github.action_path }}/scripts/pii_scanner.py
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$INPUT_OUTPUT_FILE")"
        ARGS=(--path "$INPUT_PATH" --output-format github --output-file "$INPUT_OUTPUT_FILE")
        if [ -n "$INPUT_CONFIG" ]; then
          ARGS+=(--config "$INPUT_CONFIG")
        fi
        if [ "$INPUT_ALLOW_EMPTY" = "true" ]; then
          ARGS+=(--allow-empty)
        fi
        if [ "$INPUT_ALLOW_UNSCANNED" = "true" ]; then
          ARGS+=(--allow-unscanned)
        fi
        python "$SCANNER" "${ARGS[@]}"

    - name: Model Card Validation (POL-GOV-002)
      if: ${{ !cancelled() && inputs.model-cards-path != '' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.model-cards-path }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_OUTPUT_FILE: reports/model_cards.json
        INPUT_ALLOW_EMPTY: ${{ inputs.allow-empty }}
        VALIDATOR: ${{ github.action_path }}/scripts/model_card_validator.py
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$INPUT_OUTPUT_FILE")"
        ARGS=(--path "$INPUT_PATH" --output-format github --output-file "$INPUT_OUTPUT_FILE")
        if [ -n "$INPUT_CONFIG" ]; then
          ARGS+=(--config "$INPUT_CONFIG")
        fi
        if [ "$INPUT_ALLOW_EMPTY" = "true" ]; then
          ARGS+=(--allow-empty)
        fi
        python "$VALIDATOR" "${ARGS[@]}"

    - name: Install conftest
      if: ${{ !cancelled() && inputs.terraform-paths != '' }}
      shell: bash
      env:
        VERSION: ${{ inputs.conftest-version }}
        SHA256: ${{ inputs.conftest-sha256 }}
        PINNED_VERSION: "0.56.0"
        PINNED_SHA256: "620f41640d63bbde1646a108ce2816ba54c980466ceebb7e754dda2d508e8cd5"
      run: |
        set -euo pipefail
        if command -v conftest >/dev/null; then
          echo "conftest already installed: $(conftest --version | head -1)"
          exit 0
        fi

        # A compliance toolkit that installs an unverified binary undermines
        # the thing it is asserting, so the download is checksum-pinned.
        if [ "$VERSION" != "$PINNED_VERSION" ] && [ "$SHA256" = "$PINNED_SHA256" ]; then
          echo "::error title=Conftest checksum missing::conftest-version was set to ${VERSION} but conftest-sha256 is still the checksum for ${PINNED_VERSION}. Supply the matching SHA-256 from https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/checksums.txt"
          exit 2
        fi

        TARBALL="conftest_${VERSION}_Linux_x86_64.tar.gz"
        curl -sSLf --retry 3 -o "$TARBALL" \
          "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/${TARBALL}"
        echo "${SHA256}  ${TARBALL}" | sha256sum -c -
        tar xzf "$TARBALL" conftest
        sudo mv conftest /usr/local/bin/
        rm -f "$TARBALL"

    - name: Infrastructure Policy Enforcement (POL-PRIV/SEC)
      if: ${{ !cancelled() && inputs.terraform-paths != '' }}
      shell: bash
      env:
        INPUT_POLICY_DIR: ${{ inputs.policy-dir }}
        INPUT_TERRAFORM_PATHS: ${{ inputs.terraform-paths }}
        INPUT_OUTPUT_FILE: reports/conftest.json
        DEFAULT_POLICY_DIR: ${{ github.action_path }}/policy
      run: |
        set -euo pipefail
        POLICY_DIR="$INPUT_POLICY_DIR"
        if [ -z "$POLICY_DIR" ]; then
          POLICY_DIR="$DEFAULT_POLICY_DIR"
        fi
        mkdir -p "$(dirname "$INPUT_OUTPUT_FILE")"

        # Expand globs without eval: split the input into words, then let bash
        # expand each word as a pattern. The input never reaches a shell as code.
        read -ra PATTERNS <<< "$INPUT_TERRAFORM_PATHS"
        shopt -s nullglob
        FILES=()
        for pattern in "${PATTERNS[@]}"; do
          matches=($pattern)
          if [ ${#matches[@]} -gt 0 ]; then
            FILES+=("${matches[@]}")
          fi
        done
        shopt -u nullglob

        # No match means the gate would examine nothing and report success.
        if [ ${#FILES[@]} -eq 0 ]; then
          echo "::error title=Policy Check Misconfigured::No Terraform files matched '${INPUT_TERRAFORM_PATHS}'"
          exit 2
        fi
        echo "Checking ${#FILES[@]} Terraform file(s) against ${POLICY_DIR}"

        # --combine evaluates every file as one document. Without it, rules
        # that span files (a storage account here, its diagnostic setting
        # there) produce false positives per file, and rules reading
        # variables.tf silently pass whenever that file isn't included.
        set +e
        conftest test --parser hcl2 --combine -p "$POLICY_DIR" "${FILES[@]}" \
          --output json > "$INPUT_OUTPUT_FILE"
        STATUS=$?
        set -e

        # Annotations are rendered from the JSON report, so conftest runs once.
        python3 - "$INPUT_OUTPUT_FILE" <<'PY'
        import json, sys
        try:
            data = json.load(open(sys.argv[1]))
        except (OSError, json.JSONDecodeError) as exc:
            print(f"::error title=Policy Check::could not read conftest report: {exc}")
            raise SystemExit(0)
        if isinstance(data, dict):
            data = [data]
        failures = 0
        for entry in data:
            for f in entry.get("failures") or []:
                failures += 1
                print(f"::error title=Infrastructure Policy::{f.get('msg', '')}")
            for w in entry.get("warnings") or []:
                print(f"::warning title=Infrastructure Policy::{w.get('msg', '')}")
        if failures:
            print(f"::error title=Policy Violations::{failures} policy violation(s) found")
        else:
            print("::notice title=Policy Check Passed::No policy violations")
        PY

        exit $STATUS

    # Runs even when a gate above failed: the evidence pack records what was
    # checked and what was not, which is exactly what an auditor needs from a
    # failed run.
    - name: Evidence Pack (POL-GOV-003)
      if: ${{ !cancelled() }}
      shell: bash
      env:
        INPUT_OUTPUT_DIR: ${{ inputs.evidence-dir }}
        GENERATOR: ${{ github.action_path }}/scripts/generate_evidence_pack.py
        DEFAULT_MAPPING: ${{ github.action_path }}/templates/policy_mapping.yml
      run: |
        set -euo pipefail
        python "$GENERATOR" \
          --pii-report reports/pii_scan.json \
          --model-card-report reports/model_cards.json \
          --conftest-report reports/conftest.json \
          --policy-mapping "$DEFAULT_MAPPING" \
          --output-dir "$INPUT_OUTPUT_DIR"

    - name: Verify and expose the pack digest
      id: digest
      if: ${{ !cancelled() }}
      shell: bash
      # Re-reads what was just written and checks it against its own recorded
      # digest, so a truncated or half-written pack is caught here rather than
      # by the auditor who eventually opens it.
      env:
        INPUT_OUTPUT_DIR: ${{ inputs.evidence-dir }}
        GENERATOR: ${{ github.action_path }}/scripts/generate_evidence_pack.py
      run: |
        set -euo pipefail
        PACK="$INPUT_OUTPUT_DIR/evidence_pack.json"
        python "$GENERATOR" --verify "$PACK"
        python - "$PACK" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        pack = json.load(open(sys.argv[1]))
        print(f"content-digest={pack['integrity']['content_digest']}")
        print(f"overall-result={pack['overall_result']}")
        PY

    - name: Publish job summary
      if: ${{ !cancelled() }}
      shell: bash
      env:
        INPUT_OUTPUT_DIR: ${{ inputs.evidence-dir }}
      run: |
        set -euo pipefail
        SUMMARY="$INPUT_OUTPUT_DIR/evidence_pack.md"
        if [ -f "$SUMMARY" ]; then
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::warning title=Evidence Pack::no summary written at ${SUMMARY}"
        fi

    - name: Upload evidence pack
      if: ${{ !cancelled() && inputs.upload-evidence == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.evidence-artifact-name }}
        path: ${{ inputs.evidence-dir }}/
        retention-days: ${{ inputs.evidence-retention-days }}
